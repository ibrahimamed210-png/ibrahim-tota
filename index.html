<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ibrahim & Tota</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300..800&family=Baloo+Bhaijaan+2:wght@600;700;800&family=Poppins:wght@600;700&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#2a1236;
    --bg-2:#3d1a4d;
    --grad-a:#ff6a9c;
    --grad-b:#a875ff;
    --grad-c:#ffd166;
    --grad-d:#ff9466;
    --glass:rgba(255,255,255,.08);
    --glass-2:rgba(255,255,255,.11);
    --glass-border:rgba(255,255,255,.18);
    --text-hi:#fff7fa;
    --text-mid:#e6d5e9;
    --text-dim:#bfa8c4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    font-family:'Cairo', sans-serif;
    background: linear-gradient(180deg, var(--bg-1), var(--bg-2) 55%, #331a40);
    color:var(--text-mid);
    overflow-x:hidden;
    min-height:100%;
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important;}
  }
  :focus-visible{outline:2px solid var(--grad-a); outline-offset:3px; border-radius:6px;}

  /* floating hearts rising through the background */
  .hearts{position:fixed; inset:0; z-index:1; pointer-events:none; overflow:hidden;}
  .aurora{position:fixed; inset:0; z-index:0; overflow:hidden; filter:blur(70px); opacity:.5; pointer-events:none;}
  .aurora .blob{position:absolute; border-radius:50%; mix-blend-mode:screen;}
  .aurora .b1{width:340px; height:340px; background:var(--grad-a); top:-90px; left:-70px; animation:drift1 18s ease-in-out infinite;}
  .aurora .b2{width:300px; height:300px; background:var(--grad-b); bottom:-70px; right:-50px; animation:drift2 22s ease-in-out infinite;}
  .aurora .b3{width:260px; height:260px; background:var(--grad-c); top:42%; left:58%; animation:drift3 26s ease-in-out infinite;}
  @keyframes drift1{0%,100%{transform:translate(0,0);} 50%{transform:translate(60px,40px);}}
  @keyframes drift2{0%,100%{transform:translate(0,0);} 50%{transform:translate(-50px,-30px);}}
  @keyframes drift3{0%,100%{transform:translate(0,0);} 50%{transform:translate(-40px,50px);}}
  .stars{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
  .stars span{
    position:absolute;
    width:2.5px; height:2.5px;
    border-radius:50%;
    background:#fff;
    opacity:.5;
    animation:twinkle 3.5s ease-in-out infinite;
  }
  @keyframes twinkle{
    0%,100%{opacity:.15;}
    50%{opacity:.75;}
  }
  .hearts span{
    position:absolute; bottom:-10%; font-size:16px;
    animation:rise linear infinite;
    will-change:transform, opacity;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0) rotate(0deg); opacity:0;}
    10%{opacity:.85;}
    90%{opacity:.6;}
    100%{transform:translateY(-115vh) translateX(var(--drift,20px)) rotate(20deg); opacity:0;}
  }

  /* ---------- PASSWORD SCREEN ---------- */
  #lock-screen{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
    background:
      radial-gradient(ellipse 70% 55% at 50% 0%, rgba(255,95,150,.35), transparent 60%),
      var(--bg-1);
    transition:opacity .7s ease, visibility .7s ease;
  }
  #lock-screen.hidden{opacity:0; visibility:hidden; pointer-events:none;}
  .lock-box{
    background:var(--glass-2);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--glass-border);
    border-radius:28px;
    padding:44px 32px;
    width:100%;
    max-width:380px;
    text-align:center;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
  }
  .lock-heart{
    width:34px; height:34px; margin:0 auto 14px;
  }
  .lock-title{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:34px;
    letter-spacing:.5px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .lock-sub{
    font-weight:500;
    font-size:16px;
    color:var(--text-mid);
    margin-bottom:28px;
  }
  #password-input{
    width:100%;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,.05);
    font-family:'Cairo', sans-serif;
    font-size:16px;
    text-align:center;
    outline:none;
    color:var(--text-hi);
    letter-spacing:2px;
    transition:border-color .25s, box-shadow .25s;
  }
  #password-input::placeholder{color:var(--text-dim);}
  #password-input:focus{border-color:var(--grad-a); box-shadow:0 0 0 4px rgba(255,95,150,.15);}
  #unlock-btn{
    margin-top:16px;
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
    transition:transform .2s, box-shadow .2s;
    box-shadow:0 10px 26px rgba(255,95,150,.3);
    position:relative;
    overflow:hidden;
  }
  #unlock-btn::after{
    content:'';
    position:absolute; top:0; bottom:0; left:-60%;
    width:40%;
    background:linear-gradient(100deg, transparent, rgba(255,255,255,.55), transparent);
    animation:btnShimmer 2.6s ease-in-out infinite;
  }
  @keyframes btnShimmer{
    0%{left:-60%;}
    45%{left:130%;}
    100%{left:130%;}
  }
  #unlock-btn:hover{transform:translateY(-2px); box-shadow:0 14px 32px rgba(255,95,150,.4);}
  #lock-error{
    margin-top:12px;
    color:#ff9db8;
    font-size:14px;
    min-height:18px;
  }

  /* ---------- ADMIN PANEL ---------- */
  #admin-panel{
    position:fixed; inset:0; z-index:50;
    display:flex; align-items:flex-start; justify-content:center;
    padding:20px;
    overflow-y:auto;
    background:
      radial-gradient(ellipse 70% 55% at 50% 0%, rgba(155,77,255,.35), transparent 60%),
      var(--bg-1);
  }
  #admin-panel.hidden{display:none;}
  .admin-box{
    background:var(--glass-2);
    backdrop-filter:blur(22px);
    -webkit-backdrop-filter:blur(22px);
    border:1px solid var(--glass-border);
    border-radius:28px;
    padding:32px 22px;
    width:100%;
    max-width:520px;
    margin:20px auto 60px;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
  }
  .admin-title{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-weight:700;
    font-size:26px;
    text-align:center;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    margin-bottom:6px;
  }
  .admin-sub{
    text-align:center;
    color:var(--text-dim);
    font-size:13.5px;
    margin-bottom:22px;
  }
  #admin-upload-label, .admin-upload-label{
    display:block;
    text-align:center;
    padding:16px;
    border:1.5px dashed var(--glass-border);
    border-radius:14px;
    color:var(--text-mid);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    margin-bottom:18px;
    transition:background .2s, border-color .2s;
  }
  #admin-upload-label:hover{background:rgba(255,255,255,.04); border-color:var(--grad-a);}
  #admin-photo-input{display:none;}
  .admin-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(100px,1fr));
    gap:10px;
    margin-bottom:20px;
  }
  .admin-pic-wrap{
    position:relative;
    aspect-ratio:1/1;
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--glass-border);
  }
  .admin-pic-wrap img,
  .admin-pic-wrap video{width:100%; height:100%; object-fit:cover; display:block;}
  .admin-pic-wrap.is-hidden img{opacity:.35;}
  .admin-pic-wrap .del-btn{
    position:absolute; top:5px; left:5px;
    width:24px; height:24px;
    border:none; border-radius:50%;
    background:rgba(20,10,25,.65);
    color:#fff;
    font-size:13px; line-height:1;
    cursor:pointer;
  }
  .admin-toggle-btn{
    position:absolute; bottom:5px;
    width:26px; height:26px;
    border:none; border-radius:50%;
    background:rgba(20,10,25,.65);
    color:#fff;
    font-size:13px; line-height:1;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .admin-toggle-btn.eye-btn{right:5px;}
  .admin-toggle-btn.bow-btn{left:5px;}
  .admin-toggle-btn.active{background:linear-gradient(135deg,var(--grad-a),var(--grad-b));}
  #admin-empty-note{
    text-align:center;
    color:var(--text-dim);
    font-size:14px;
    padding:6px 0 16px;
  }
  #admin-done-btn{
    display:block;
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:16px;
    cursor:pointer;
  }
  #admin-note{
    text-align:center;
    color:var(--grad-c);
    font-size:13px;
    font-weight:600;
    margin-top:12px;
    min-height:16px;
  }

  /* ---------- MAIN SITE ---------- */
  #site{
    position:relative; z-index:2;
    max-width:640px;
    margin:0 auto;
    padding:48px 18px 140px;
    opacity:0;
    transition:opacity 1s ease;
  }
  #site.show{opacity:1;}

  header.hero{
    text-align:center;
    padding:20px 10px 8px;
  }
  .names{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:clamp(36px,10vw,52px);
    letter-spacing:.5px;
    background:linear-gradient(100deg,#ffd3e2,var(--grad-a) 45%,var(--grad-b) 65%,#ffd3e2 85%);
    background-size:250% 100%;
    -webkit-background-clip:text; background-clip:text; color:transparent;
    line-height:1.15;
    animation:titleShimmer 2.8s ease-out .3s 1;
  }
  @keyframes titleShimmer{
    0%{background-position:100% 0;}
    100%{background-position:0% 0;}
  }
  .hero-line{
    margin-top:10px;
    font-weight:500;
    font-size:16px;
    color:var(--text-dim);
  }
  .divider{
    width:64px; height:3px; margin:26px auto 0;
    border-radius:3px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
  }

  .glass-card{
    background:var(--glass);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    border:1px solid rgba(255,106,156,.35);
    border-radius:24px;
    padding:30px 24px;
    box-shadow:0 0 0 1px rgba(168,117,255,.12), 0 0 26px rgba(255,106,156,.16);
  }

  section{margin-bottom:30px;}
  section.reveal{
    opacity:0;
    transform:translateY(18px);
    transition:opacity .7s ease, transform .7s ease;
  }
  section.reveal.in-view{
    opacity:1;
    transform:translateY(0);
  }
  section h2{
    font-weight:800;
    font-size:20px;
    color:var(--text-hi);
    text-align:center;
    margin-bottom:22px;
  }

  /* ---- counter ---- */
  .counter-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:10px;
    text-align:center;
  }
  .counter-box{
    background:rgba(255,255,255,.05);
    border:1px solid var(--glass-border);
    border-radius:16px;
    padding:16px 4px;
  }
  .counter-num{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    font-size:clamp(24px,6vw,32px);
    background:linear-gradient(180deg,#fff,var(--grad-a));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .counter-label{
    font-size:12.5px;
    color:var(--text-dim);
    margin-top:4px;
  }
  .counter-note{
    text-align:center;
    margin-top:18px;
    font-size:14px;
    font-weight:600;
    color:var(--text-mid);
  }

  /* ---- stop section + flip cards ---- */
  .stop-line{
    font-family:'Baloo Bhaijaan 2', sans-serif;
    font-weight:700;
    font-size:clamp(22px,5.5vw,28px);
    text-align:center;
    color:var(--text-hi);
    margin-bottom:28px;
  }
  .mini-words{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:16px;
    margin-bottom:36px;
  }
  .mini-word{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    font-weight:800;
    font-size:21px;
    color:var(--text-hi);
    background:rgba(255,255,255,.07);
    backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);
    border:1px solid var(--glass-border);
    border-radius:999px;
    padding:12px 26px;
    width:fit-content;
  }
  .mini-word svg{width:22px; height:22px; flex:0 0 auto;}

  /* ---- timeline ---- */
  .timeline{
    position:relative;
    padding-right:32px;
  }
  .timeline::before{
    content:'';
    position:absolute;
    right:9px; top:6px; bottom:6px;
    width:2px;
    background:linear-gradient(180deg,var(--grad-a),var(--grad-b));
  }
  .timeline-item{
    position:relative;
    padding-bottom:26px;
  }
  .timeline-item:last-child{padding-bottom:0;}
  .timeline-dot{
    position:absolute;
    right:-32px; top:2px;
    width:20px; height:20px;
    border-radius:50%;
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    display:flex; align-items:center; justify-content:center;
    font-size:11px;
    box-shadow:0 0 0 4px rgba(255,106,156,.18);
  }
  .timeline-date{
    font-size:12.5px;
    font-weight:700;
    color:var(--grad-c);
    margin-bottom:3px;
  }
  .timeline-title{
    font-size:15.5px;
    font-weight:700;
    color:var(--text-hi);
  }
  .timeline-note{
    font-size:13.5px;
    color:var(--text-mid);
    margin-top:3px;
  }
  .timeline-note:empty{display:none;}

  /* ---- letter ---- */
  .letter{
    font-weight:400;
    font-size:16.5px;
    line-height:2.05;
    color:var(--text-mid);
    white-space:pre-line;
    text-align:justify;
  }
  .letter .signature{
    display:flex; align-items:center; gap:10px;
    margin-top:22px;
    font-family:'Great Vibes', cursive;
    font-size:34px;
    color:var(--text-hi);
  }
  .heart-icon{width:22px; height:22px; flex:0 0 auto;}
  .reply-signature{
    margin-top:14px;
    justify-content:flex-end;
  }
  .reply-signature.hidden{display:none;}

  /* ---- animated heart ---- */
  .heart-card{
    padding:0;
    overflow:hidden;
    background:#111;
    border-color:rgba(255,106,156,.25);
  }
  #heart-canvas{
    display:block;
    width:100%;
    height:360px;
  }

  /* ---- daily reason ---- */
  .reasons-day{
    font-size:13px;
    font-weight:600;
    color:var(--grad-c);
    margin-bottom:12px;
    letter-spacing:.3px;
  }
  .reasons-today{
    font-size:19px;
    font-weight:700;
    color:var(--text-hi);
    line-height:1.7;
    min-height:50px;
    opacity:0;
    animation:reasonFade .6s ease forwards;
  }
  @keyframes reasonFade{
    from{opacity:0; transform:translateY(8px);}
    to{opacity:1; transform:translateY(0);}
  }

  /* ---- memory box ---- */
  .box-emoji{
    font-size:64px;
    margin-bottom:10px;
    display:inline-block;
    animation:boxFloat 2.6s ease-in-out infinite;
    filter:drop-shadow(0 8px 18px rgba(255,106,156,.35));
  }
  @keyframes boxFloat{
    0%,100%{transform:translateY(0) rotate(-3deg);}
    50%{transform:translateY(-8px) rotate(3deg);}
  }
  .box-emoji.shaking{animation:boxShake .45s ease;}
  @keyframes boxShake{
    0%,100%{transform:translate(0,0) rotate(0);}
    20%{transform:translate(-6px,0) rotate(-8deg);}
    40%{transform:translate(6px,0) rotate(8deg);}
    60%{transform:translate(-5px,0) rotate(-6deg);}
    80%{transform:translate(5px,0) rotate(6deg);}
  }
  #memory-box-open.hidden{display:none;}
  .memory-pic{animation:memPopIn .5s ease both;}
  @keyframes memPopIn{
    from{opacity:0; transform:scale(.7) translateY(12px);}
    to{opacity:1; transform:scale(1) translateY(0);}
  }
  .surprise-style-btn{
    padding:13px 34px;
    border:none;
    border-radius:999px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15.5px;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(255,95,150,.3);
    transition:transform .2s;
  }
  .surprise-style-btn:hover{transform:translateY(-2px);}

  /* ---- surprise button ---- */
  #surprise-text{
    color:var(--text-mid);
    font-size:15.5px;
    line-height:1.9;
    margin-bottom:20px;
    min-height:54px;
  }
  #surprise-btn{
    padding:13px 34px;
    border:none;
    border-radius:999px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15.5px;
    cursor:pointer;
    box-shadow:0 10px 26px rgba(255,95,150,.3);
    transition:transform .2s;
  }
  #surprise-btn:hover{transform:translateY(-2px);}
  #surprise-btn:active{transform:scale(.97);}

  /* ---- reply ---- */
  #reply-box{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid var(--glass-border);
    background:rgba(255,255,255,.05);
    font-family:'Cairo', sans-serif;
    font-size:15.5px;
    color:var(--text-hi);
    resize:vertical;
    outline:none;
    transition:border-color .25s, box-shadow .25s;
  }
  #reply-box::placeholder{color:var(--text-dim);}
  #reply-box:focus{border-color:var(--grad-a); box-shadow:0 0 0 4px rgba(255,95,150,.12);}
  #save-reply-btn{
    display:block;
    margin:16px auto 0;
    padding:12px 36px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,var(--grad-a),var(--grad-b));
    color:#fff;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
    transition:transform .2s;
  }
  #save-reply-btn:hover{transform:translateY(-1px);}
  #save-reply-btn.hidden{display:none;}
  #reply-saved-note{
    text-align:center;
    color:var(--grad-c);
    font-size:13.5px;
    font-weight:600;
    margin-top:10px;
    min-height:16px;
  }

  /* ---- chat corner ---- */
  #chat-name-gate{
    text-align:center;
    padding:10px 0;
  }
  #chat-name-gate p{
    color:var(--text-mid);
    font-size:14.5px;
    margin-bottom:14px;
  }
  .chat-name-btns{display:flex; gap:10px; justify-content:center;}
  .chat-name-btn{
    flex:1; max-width:150px;
    padding:12px;
    border:1px solid var(--glass-border);
    border-radius:12px;
    background:rgba(255,255,255,.06);
    color:var(--text-hi);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:15px;
    cursor:pointer;
  }
  .chat-name-btn:active{background:rgba(255,255,255,.14);}
  #chat-window.hidden, #chat-name-gate.hidden{display:none;}
  #chat-messages{
    display:flex; flex-direction:column; gap:8px;
    max-height:320px; overflow-y:auto;
    padding:6px 2px 10px;
    margin-bottom:12px;
  }
  .chat-bubble-wrap{
    display:flex; flex-direction:column;
    max-width:78%;
    position:relative;
  }
  .chat-bubble-wrap.mine{align-self:flex-end; align-items:flex-end;}
  .chat-bubble-wrap.theirs{align-self:flex-start; align-items:flex-start;}
  .chat-bubble{
    max-width:100%;
    padding:9px 14px;
    border-radius:16px;
    font-size:14.5px;
    line-height:1.5;
    color:var(--text-hi);
    word-wrap:break-word;
    cursor:pointer;
  }
  .chat-bubble .sender{
    display:block;
    font-size:11px;
    font-weight:700;
    opacity:.7;
    margin-bottom:2px;
  }
  .chat-bubble-wrap.mine .chat-bubble{
    background:linear-gradient(135deg,var(--grad-a),var(--grad-b));
    border-bottom-left-radius:5px;
  }
  .chat-bubble-wrap.theirs .chat-bubble{
    background:rgba(255,255,255,.09);
    border:1px solid var(--glass-border);
    border-bottom-right-radius:5px;
  }
